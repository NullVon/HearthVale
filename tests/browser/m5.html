<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M5B fixtures</title>
<body><h1>M5B browser fixtures</h1><p>Test-only prerequisites through Core effects. The major record comes from actual discovery, combat, material turn-in and Town request actions. Resolve the poisoned room to test the death transition.</p><div id="fixtures"></div><p id="status" role="status"></p><a href="../../HearthVale_UI/index.html">Open HearthVale, then Load Saved Game</a>
<script type="module">import {fixtures} from './m5-fixtures.js';for(const [name,saved]of Object.entries(fixtures)){const b=document.createElement('button');b.textContent=name;b.style.cssText='display:block;min-height:48px;margin:12px';b.onclick=()=>{localStorage.setItem('hearthvale.surface.save.v1',saved);document.querySelector('#status').textContent=`${name} saved.`;};document.querySelector('#fixtures').append(b);}</script></body></html>
