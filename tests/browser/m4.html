<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M4 integrated browser fixtures</title>
<body><h1>M4 integrated browser fixtures</h1><p>Test-only Core snapshots on a separate localhost port. Prior Rook encounter and held materials are fixture preconditions; completion uses normal gameplay.</p><div id="fixtures"></div><p id="status" role="status"></p><a href="../../HearthVale_UI/index.html">Open HearthVale, then Load Saved Game</a>
<script type="module">import {fixtures} from './m4-fixtures.js';for(const [name,saved]of Object.entries(fixtures)){const button=document.createElement('button');button.textContent=name;button.style.cssText='display:block;min-height:48px;margin:12px';button.onclick=()=>{localStorage.setItem('hearthvale.surface.save.v1',saved);document.querySelector('#status').textContent=`${name} saved. Open HearthVale and Load Saved Game.`;};document.querySelector('#fixtures').append(button);}</script></body></html>
