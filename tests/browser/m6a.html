<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M6A ending fixtures</title>
<body><h1>M6A ending fixtures</h1><p>Controlled combat resources and calendar prerequisites. Select a checkpoint, open HearthVale, then Load Saved Game. Resolve the ending through normal controls.</p><div id="fixtures"></div><p id="status" role="status"></p><a href="../../HearthVale_UI/index.html">Open HearthVale, then Load Saved Game</a>
<script type="module">import {fixtures} from './m6a-fixtures.js';for(const [name,saved]of Object.entries(fixtures)){const b=document.createElement('button');b.textContent=name;b.style.cssText='display:block;min-height:48px;margin:12px';b.onclick=()=>{localStorage.setItem('hearthvale.surface.save.v1',saved);document.querySelector('#status').textContent=`${name} saved.`;};document.querySelector('#fixtures').append(b);}</script></body></html>
